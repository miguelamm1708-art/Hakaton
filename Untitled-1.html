<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Quiniela del Mundial 2026 ⚽</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🏆 Nuestra Quiniela Mundialista</h1>
        <p>Elige un grupo y haz tus predicciones</p>
    </header>

    <main class="contenedor">
        <!-- Menú de pestañas para cambiar de Grupo (JS meterá los botones aquí) -->
        <nav id="menu-grupos" class="menu-navegacion"></nav>

        <!-- Aquí JS meterá SOLAMENTE el grupo activo (Su tabla y sus partidos) -->
        <section id="contenedor-grupo-activo"></section>
        
        <button id="btn-calcular" class="btn-principal">Guardar y Calcular Mis Puntos</button>

        <!-- Sección de Resultados -->
        <section class="seccion-resultados">
            <h2>📊 Tu Puntuación Total</h2>
            <div class="tablero-puntos">
                <p>Puntos Totales: <span id="puntos-totales" class="puntos">0</span></p>
                <p id="mensaje-resultado" class="mensaje">Selecciona los grupos, pon tus marcas y calcula tu puntuación.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
